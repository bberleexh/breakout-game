<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>拧螺丝解谜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;background:#eaf6ff;color:#2a3340;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:16px;box-shadow:0 8px 28px rgba(40,80,120,.18)}
#overlay,#pauseMenu{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(180,214,235,.28);border-radius:16px;gap:0;text-align:center;padding:20px 16px;z-index:5;
}
#pauseMenu{background:rgba(20,40,60,.45);gap:14px}
#card{
  background:rgba(255,255,255,.94);border-radius:22px;padding:22px 18px 20px;width:min(300px,86%);
  box-shadow:0 10px 30px rgba(40,80,120,.18);display:flex;flex-direction:column;align-items:center;gap:12px;
}
#overlay.hidden,#pauseMenu.hidden,#playUi.hidden{display:none}
#overlay h1{font-size:30px;letter-spacing:2px;font-weight:800;color:#2a5f9e;text-shadow:0 2px 0 #d6ebff}
#pauseMenu h1{font-size:34px;letter-spacing:2px;font-weight:800;color:#fff;text-shadow:0 3px 0 #3a7bd5,0 6px 12px rgba(0,0,0,.25)}
#overlay p{font-size:14px;color:#3a5268;line-height:1.7;max-width:240px}
#pauseMenu p{font-size:15px;color:#f4fbff;line-height:1.7;max-width:270px;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.stats{font-size:16px;color:#3a5268;font-weight:700;line-height:1.8}
.stats b{color:#e09b00}
#pauseMenu .stats{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
#pauseMenu .stats b{color:#ffd54a}
button.main{
  background:#ffd54a;color:#3a2a0a;border:3px solid #c27a14;padding:12px 36px;border-radius:999px;
  font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #c27a14;font-family:inherit;
}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #c27a14}
button.ghost{
  background:#fff;color:#2a3340;border:3px solid #8ab4d8;padding:10px 28px;border-radius:999px;
  font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #8ab4d8;font-family:inherit;
}
#playUi{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:16px}
#playUi button,#playUi .item{pointer-events:auto}
#pauseBtn{
  position:absolute;left:12px;top:12px;width:42px;height:42px;border:0;border-radius:50%;
  background:#3b89f0;color:#fff;box-shadow:0 3px 0 #1f63c4;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#pauseBtn::before{content:"";width:12px;height:16px;border-left:4px solid #fff;border-right:4px solid #fff;}
#levelTag{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);
  background:#2b3340;color:#fff;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:800;
}
#progTag{
  position:absolute;right:12px;top:168px;background:rgba(255,255,255,.9);border-radius:12px;
  padding:6px 8px 6px 8px;font-size:11px;font-weight:800;color:#5a6573;text-align:center;line-height:1.3;
  box-shadow:0 2px 8px rgba(0,0,0,.08);min-width:52px;
}
#items{
  position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:12px;
}
.item{
  width:82px;height:70px;background:#fff;border:0;border-radius:16px;box-shadow:0 3px 0 #c5d6ea;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  font-family:inherit;position:relative;color:#3a4550;
}
.item.armed{outline:3px solid #3b89f0;outline-offset:1px}
.item.off{opacity:.45}
.item .ico{font-size:22px;font-weight:900;line-height:1}
.item .lab{font-size:11px;font-weight:800}
.item .uses{
  position:absolute;top:-6px;right:-6px;background:#3ddc5a;color:#fff;border-radius:50%;
  width:20px;height:20px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 #1ea03a;
}
#toast{
  position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);background:rgba(30,40,55,.84);
  color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:700;pointer-events:none;
  opacity:0;transition:opacity .2s;z-index:6;white-space:nowrap;
}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="playUi" class="hidden">
    <button id="pauseBtn" type="button" aria-label="暂停"></button>
    <div id="levelTag">第1关</div>
    <div id="progTag">📦<br>进度<br><b id="prog">0%</b></div>
    <div id="items">
      <button class="item" id="itAdd" type="button"><span class="uses" id="uAdd">1</span><span class="ico" style="color:#3ddc5a">+1</span><span class="lab">加孔位</span></button>
      <button class="item" id="itClear" type="button"><span class="uses" id="uClear">1</span><span class="ico">🖌️</span><span class="lab">清空孔位</span></button>
      <button class="item" id="itMelt" type="button"><span class="uses" id="uMelt">0</span><span class="ico">🧪</span><span class="lab">熔玻璃</span></button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="overlay">
    <div id="card">
      <h1 id="title">拧螺丝解谜</h1>
      <p id="msg">点螺丝拧出，放进同色盒子；清掉全部板子就过关</p>
      <div id="endStats" class="stats" hidden></div>
      <button class="main" id="start" type="button">开始游戏</button>
    </div>
  </div>
  <div id="pauseMenu" class="hidden">
    <h1>暂停</h1>
    <button class="main" id="resume" type="button">继续</button>
    <button class="ghost" id="restart" type="button">重玩本关</button>
    <button class="ghost" id="home" type="button">返回首页</button>
  </div>
</div>
<script>
(function(){
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch (e) {} }
  };

  const W=390, H=700, SR=15;
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  const dpr=Math.min(2, window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const $=id=>document.getElementById(id);

  function fit(){
    const sc=Math.min((innerWidth-16)/W,(innerHeight-16)/H);
    cv.style.width=(W*sc)+'px'; cv.style.height=(H*sc)+'px';
  }
  addEventListener('resize',fit); addEventListener('orientationchange',fit); fit();

  const SCREW = {
    green:'#3ddc5a', brown:'#8B5A2B', purple:'#A855F7', yellow:'#F5C400',
    pink:'#FF5A9A', blue:'#3BA3F0', orange:'#FF8A3D', cyan:'#1ec8c8'
  };
  const SCREW_IN = {
    green:'#d8ffb0', brown:'#e8c9a0', purple:'#f0d4ff', yellow:'#fff4b0',
    pink:'#ffd0e4', blue:'#d0eeff', orange:'#ffe0c4', cyan:'#c8fffc'
  };

  function rect(w,h){ return [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]]; }
  function polyL(w,h,t,mirror){
    let p=[[-w/2,-h/2],[w/2,-h/2],[w/2,-h/2+t],[-w/2+t,-h/2+t],[-w/2+t,h/2],[-w/2,h/2]];
    if(mirror) p=p.map(([x,y])=>[-x,y]);
    return p;
  }
  function star(r, inner){
    const pts=[]; inner=inner||0.42;
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5, rad=i%2===0?r:r*inner;
      pts.push([Math.cos(a)*rad, Math.sin(a)*rad]);
    }
    return pts;
  }
  function polyT(w,h,t){
    const hw=w/2, hh=h/2;
    return [[-hw,-hh],[hw,-hh],[hw,-hh+t],[t/2,-hh+t],[t/2,hh],[-t/2,hh],[-t/2,-hh+t],[-hw,-hh+t]];
  }
  function polyU(w,h,t){
    const hw=w/2, hh=h/2;
    return [[-hw,-hh],[-hw+t,-hh],[-hw+t,hh-t],[hw-t,hh-t],[hw-t,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  }
  function polyPlus(a,t){
    const h=a, o=t/2;
    return [[-o,-h],[o,-h],[o,-o],[h,-o],[h,o],[o,o],[o,h],[-o,h],[-o,o],[-h,o],[-h,-o],[-o,-o]];
  }
  function hex(r){
    const p=[]; for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3; p.push([Math.cos(a)*r,Math.sin(a)*r]); }
    return p;
  }
  function petal(rx, ry, lobes, dent){
    lobes=lobes||5; dent=dent||0.55; ry=ry||rx;
    const pts=[], steps=lobes*8;
    for(let i=0;i<steps;i++){
      const a=-Math.PI/2+i*Math.PI*2/steps;
      const wave=Math.pow(0.5+0.5*Math.cos(a*lobes), 1.15);
      const rad=dent+(1-dent)*wave;
      pts.push([Math.cos(a)*rx*rad, Math.sin(a)*ry*rad]);
    }
    return pts;
  }
  function blob(rx, ry, v){
    ry=ry||rx*0.86;
    const amps=[
      [1.00,0.84,1.06,0.80,0.98,0.82,1.08,0.88],
      [0.92,1.08,0.86,1.02,0.78,1.06,0.90,1.00],
      [1.05,0.88,0.96,1.10,0.82,0.94,1.04,0.86]
    ][v||0];
    const n=amps.length, pts=[];
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+i*Math.PI*2/n;
      pts.push([Math.cos(a)*rx*amps[i], Math.sin(a)*ry*amps[i]]);
    }
    return pts;
  }
  function xform(pts,x,y,rot){
    const c=Math.cos(rot||0), s=Math.sin(rot||0);
    return pts.map(([px,py])=>[px*c-py*s+x, px*s+py*c+y]);
  }
  function pip(x,y,poly){
    let c=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
      if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi+1e-9)+xi)) c=!c;
    }
    return c;
  }
  function distToSeg(px,py,ax,ay,bx,by){
    const vx=bx-ax, vy=by-ay, den=vx*vx+vy*vy;
    const t=den<1e-9?0:Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/den));
    return Math.hypot(px-ax-t*vx, py-ay-t*vy);
  }
  // Circle vs polygon: center inside, or any edge within radius r.
  function circleHitsPoly(cx,cy,r,poly){
    if(!poly || poly.length<3) return false;
    if(pip(cx,cy,poly)) return true;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      if(distToSeg(cx,cy, poly[j][0],poly[j][1], poly[i][0],poly[i][1])<=r) return true;
    }
    return false;
  }
  // Visual cover: whole screw head (plus a little edge) vs a board/glass drawn with a fat stroke.
  const BOARD_STROKE=7;  // half of the 14px white outline
  const GLASS_STROKE=4;  // half of the 8px glass outline
  const SCREW_EDGE=3;    // screw-head stroke + a little margin
  const BLOCK_R=SR+SCREW_EDGE+BOARD_STROKE;
  const GLASS_R=SR+SCREW_EDGE+GLASS_STROKE;
  const HOLD_Y=178, HOLD_GAP=38, HOLD_R=15, HOLD_MAX=5, HOLD_START=3;
  function lerp(a,b,t){ return a+(b-a)*t; }
  function ease(t){ return 1-Math.pow(1-t,3); }
  function hexRgba(h,a){
    let n=(h||'#cccccc').replace('#','');
    if(n.length===3) n=n.split('').map(c=>c+c).join('');
    const v=parseInt(n,16);
    return 'rgba('+(v>>16)+','+((v>>8)&255)+','+(v&255)+','+a+')';
  }

  function makeShape(def){
    if(def[0]==='rect') return rect(def[1],def[2]);
    if(def[0]==='l') return polyL(def[1],def[2],def[3], !!def[4]);
    if(def[0]==='star') return star(def[1], def[2]);
    if(def[0]==='t') return polyT(def[1],def[2],def[3]);
    if(def[0]==='u') return polyU(def[1],def[2],def[3]);
    if(def[0]==='plus') return polyPlus(def[1],def[2]);
    if(def[0]==='hex') return hex(def[1]);
    if(def[0]==='petal') return petal(def[1], def[2], def[3], def[4]);
    if(def[0]==='blob') return blob(def[1], def[2], def[3]);
    return rect(80,80);
  }

  /* boards: {s, x,y,r,col,z, sc:[[lx,ly,color],...] }  queue: color names */
  const LEVELS = [
    { // 1 大块叠层异形玻璃，可教暂存

      boards:[
        {s:['l',220,200,84,false], x:126,y:348,r:-0.36, col:'#7FE0F0', z:2, sc:[[-76,-58,'green'],[76,-58,'brown'],[-70,68,'purple']]},
        {s:['star',118], x:214,y:428,r:0.14, col:'#FFE56A', z:1, sc:[[0,-46,'brown'],[40,16,'green'],[-40,16,'purple']]},
        {s:['petal',114,100,5,0.56], x:262,y:518,r:0.18, col:'#FFB0D0', z:0, sc:[[-40,-18,'purple'],[40,-14,'green'],[0,42,'brown']]}
      ]
    },
    { // 2 四色，L+花瓣+星+U
      slots:2, items:{add:1,clear:1,melt:0,unlock:1},
      queue:['green','brown','purple','yellow'],
      boards:[
        {s:['l',200,184,78,false], x:118,y:328,r:-0.40, col:'#7FE0F0', z:3, sc:[[-70,-54,'green'],[70,-54,'brown'],[-64,62,'yellow']]},
        {s:['blob',112,94,0], x:210,y:402,r:0.10, col:'#C0EC70', z:2, sc:[[-36,-16,'brown'],[36,-10,'purple'],[0,32,'green']]},
        {s:['star',98], x:272,y:348,r:-0.12, col:'#FFE56A', z:1, sc:[[0,-36,'purple'],[32,14,'yellow'],[-32,14,'green']]},
        {s:['u',210,132,58], x:200,y:532,r:0.06, col:'#FFB0D0', z:0, sc:[[-72,-28,'yellow'],[72,-28,'purple'],[0,42,'brown']]}
      ]
    },
    { // 3 五块异形，四色混色
      slots:2, items:{add:1,clear:1,melt:0,unlock:1},
      queue:['green','brown','yellow','purple'],
      boards:[
        {s:['l',198,178,76,false], x:112,y:322,r:-0.42, col:'#7FE0F0', z:4, sc:[[-68,-52,'green'],[68,-52,'brown'],[-62,60,'yellow']]},
        {s:['l',198,178,76,true], x:280,y:322,r:0.42, col:'#C0EC70', z:3, sc:[[68,-52,'brown'],[-68,-52,'purple'],[62,60,'green']]},
        {s:['star',96], x:196,y:412,r:0.10, col:'#FFB0D0', z:2, sc:[[0,-36,'yellow'],[32,14,'purple']]},
        {s:['blob',100,86,1], x:196,y:470,r:-0.2, col:'#FFE56A', z:1, sc:[[-30,-10,'green'],[30,8,'brown']]},
        {s:['petal',90,80,5,0.58], x:196,y:548,r:0.15, col:'#D0B8F0', z:0, sc:[[-28,-12,'yellow'],[28,10,'purple']]}
      ]
    },
    { // 4 接近参考图的双L+星
      slots:2, items:{add:1,clear:1,melt:0,unlock:1},
      queue:['green','brown','purple','yellow','pink'],
      boards:[
        {s:['l',200,180,76,false], x:112,y:325,r:-0.48, col:'#7FE0F0', z:4, sc:[[-70,-52,'green'],[70,-52,'brown'],[0,-52,'yellow']]},
        {s:['star',104], x:196,y:412,r:0.08, col:'#FFE56A', z:3, sc:[[0,-40,'brown'],[34,14,'green'],[-34,14,'purple'],[22,-18,'pink']]},
        {s:['l',200,180,76,true], x:280,y:325,r:0.48, col:'#C0EC70', z:2, sc:[[70,-52,'purple'],[-70,-52,'pink'],[0,-52,'brown']]},
        {s:['blob',108,90,0], x:130,y:520,r:0.2, col:'#FFB0D0', z:1, sc:[[-32,-12,'yellow'],[32,6,'purple'],[0,30,'green']]},
        {s:['u',190,120,54], x:268,y:535,r:-0.12, col:'#FFC8A0', z:0, sc:[[-64,-24,'pink'],[64,-24,'yellow']]}
      ]
    },
    { // 5 六块更密，五色
      slots:2, items:{add:1,clear:1,melt:0,unlock:1},
      queue:['green','brown','yellow','purple','pink'],
      boards:[
        {s:['t',210,140,62], x:196,y:300,r:0, col:'#FFE56A', z:5, sc:[[-72,-40,'green'],[72,-40,'brown'],[0,-40,'purple']]},
        {s:['star',90], x:196,y:400,r:-0.1, col:'#FFB0D0', z:4, sc:[[0,-32,'brown'],[28,12,'yellow'],[-28,12,'pink']]},
        {s:['l',176,156,68,false], x:108,y:430,r:0.15, col:'#7FE0F0', z:3, sc:[[-60,-44,'yellow'],[56,-44,'purple']]},
        {s:['l',176,156,68,true], x:284,y:430,r:-0.15, col:'#C0EC70', z:2, sc:[[60,-44,'purple'],[-56,-44,'pink'],[52,48,'green']]},
        {s:['blob',88,74,2], x:196,y:500,r:0.1, col:'#D0B8F0', z:1, sc:[[-24,-8,'pink'],[24,6,'green']]},
        {s:['petal',78,70,5,0.58], x:196,y:552,r:0, col:'#A8E8C0', z:0, sc:[[-22,-8,'yellow'],[22,8,'brown']]}
      ]
    },
    { // 6 首次玻璃，四色
      slots:2, items:{add:1,clear:1,melt:1,unlock:1},
      queue:['green','brown','yellow','purple'],
      boards:[
        {s:['plus',90,58], x:196,y:310,r:0.2, col:'#7FE0F0', z:4, sc:[[0,-56,'green'],[56,0,'yellow']]},
        {s:['l',180,160,70,false], x:114,y:430,r:-0.12, col:'#FFB0D0', z:3, sc:[[-62,-44,'brown'],[58,-44,'purple'],[-54,50,'green']]},
        {s:['l',180,160,70,true], x:278,y:430,r:0.12, col:'#FFE56A', z:2, sc:[[62,-44,'yellow'],[-58,-44,'brown'],[54,50,'purple']]},
        {s:['blob',96,82,1], x:196,y:470,r:0, col:'#C0EC70', z:1, sc:[[-28,-12,'yellow'],[28,10,'green']]},
        {s:['hex',74], x:196,y:548,r:0.08, col:'#D0B8F0', z:0, sc:[[-26,-12,'purple'],[26,-8,'brown']]}
      ],
      glass:[{s:['hex',80], x:196,y:548,r:0.08}]
    },
    { // 7 星+双L，六色，玻璃
      slots:2, items:{add:2,clear:1,melt:1,unlock:1},
      queue:['green','brown','purple','yellow','pink','blue'],
      boards:[
        {s:['star',92], x:196,y:350,r:-0.08, col:'#FFB0D0', z:5, sc:[[0,-34,'green'],[30,12,'brown'],[-30,12,'purple'],[20,-16,'yellow'],[-20,-16,'pink']]},
        {s:['l',190,170,72,false], x:108,y:318,r:-0.38, col:'#7FE0F0', z:4, sc:[[-66,-48,'brown'],[64,-48,'green'],[0,-48,'blue'],[-56,54,'purple']]},
        {s:['l',190,170,72,true], x:284,y:318,r:0.38, col:'#C0EC70', z:3, sc:[[66,-48,'purple'],[-64,-48,'yellow'],[0,-48,'brown']]},
        {s:['blob',108,88,0], x:196,y:490,r:0, col:'#FFE56A', z:2, sc:[[-34,-8,'yellow'],[34,8,'blue']]},
        {s:['petal',72,64,5,0.58], x:108,y:548,r:0.1, col:'#FFC8A0', z:1, sc:[[-18,4,'pink'],[22,6,'blue']]},
        {s:['hex',70], x:284,y:548,r:0, col:'#D0B8F0', z:0, sc:[[-20,4,'pink'],[24,4,'green']]}
      ],
      glass:[{s:['blob',96,80,0], x:196,y:490,r:0}]
    },
    { // 8 六色更密
      slots:2, items:{add:2,clear:2,melt:1,unlock:1},

  function worldBoard(b){ return xform(b.poly, b.x, b.y, b.r); }

  function screwBlocked(s){
    if(s.removed) return true;
    for(const b of boards){
      if(b.removed || b.z<=s.z) continue;
      if(circleHitsPoly(s.x, s.y, BLOCK_R, worldBoard(b))) return true;
    }
    if(!glassMelted){
      for(const g of glass){
        if(circleHitsPoly(s.x, s.y, GLASS_R, g.poly)) return true;
      }
    }
    return false;
  }
  // Click lands on a higher board or unmelted glass (including their outlines).
  function tapOnHigherCover(x,y,z){
    for(const b of boards){
      if(b.removed || b.z<=z) continue;
      if(circleHitsPoly(x, y, BOARD_STROKE, worldBoard(b))) return true;
    }
    if(!glassMelted){
      for(const g of glass){
        if(circleHitsPoly(x, y, GLASS_STROKE, g.poly)) return true;
      }
    }
    return false;
  }

  function toast(m){
    toastMsg=m; toastT=1.4;
    const el=$('toast'); el.textContent=m; el.classList.add('show');
  }

  function layoutSlots(){
    const n=maxShow;
    const gap=88, total=n*gap, x0=(W-total)/2+gap/2;
    return Array.from({length:n},(_,i)=>({x:x0+i*gap, y:108}));
  }
  function holdLayout(){
    const n=holdCount, total=n*HOLD_GAP, x0=(W-total)/2+HOLD_GAP/2;
    return Array.from({length:n},(_,i)=>({x:x0+i*HOLD_GAP, y:HOLD_Y}));
  }
  function compactHolds(){
    if(holds.some(h=>h && h.incoming)) return;
    const kept=holds.filter(h=>h);
    while(kept.length<holdCount) kept.push(null);
    holds=kept.slice(0, holdCount);
  }
  function freeHoldIndex(){
    return holds.findIndex(h=>!h);
  }

  function syncItems(){
    const map=[['add','uAdd','itAdd'],['clear','uClear','itClear'],['melt','uMelt','itMelt']];
    map.forEach(([k,uid,bid])=>{
      $(uid).textContent=items[k];
      $(bid).classList.toggle('off', items[k]<=0);
      $(bid).classList.toggle('armed', armed===k);
    });
  }

  function progress(){
    const tot=screws.length, done=screws.filter(s=>s.removed).length;
    return tot? Math.round(done/tot*100):0;
  }

  function refreshHud(){
    $('levelTag').textContent='第'+(levelIdx+1)+'关';
    $('prog').textContent=progress()+'%';
    syncItems();
  }

  function buildLevel(i){
    const L=LEVELS[i];
    boards=L.boards.map((b,bi)=>{
      const poly=makeShape(b.s);
      return { id:bi, poly, x:b.x, y:b.y, r:b.r||0, col:b.col, z:b.z, removed:false, fall:0, s:b.s };
    });
    screws=[];
    L.boards.forEach((b,bi)=>{
      const c=Math.cos(b.r||0), s=Math.sin(b.r||0);
      b.sc.forEach((sc)=>{
        const lx=sc[0], ly=sc[1];
        screws.push({
          id:screws.length, bid:bi, z:b.z,
          x:lx*c-ly*s+b.x, y:lx*s+ly*c+b.y,
          color:sc[2], removed:false
        });
      });
    });
    glass=(L.glass||[]).map(g=>({ poly:xform(makeShape(g.s), g.x, g.y, g.r||0), s:g.s, x:g.x, y:g.y, r:g.r||0 }));
    glassMelted=false;
    queue=L.queue.map(c=>({color:c, cap:3, fill:[]}));
    slotCount=L.slots||2;
    items={add:L.items.add, clear:L.items.clear, melt:L.items.melt, unlock:L.items.unlock};
    armed=null;
    holdCount=HOLD_START;
    holds=Array.from({length:holdCount},()=>null);
    const pos=layoutSlots();
    slots=pos.map((p,i)=>({ x:p.x, y:p.y, box: i<slotCount && queue.length? queue.shift(): null, locked:i>=slotCount }));
    flies=[]; falls=[]; sparks=[]; winPending=false; failPending=false;
    refreshHud();
  }

  function currentBoxes(){ return slots.filter(s=>s.box); }

  function findBoxFor(color){
    return slots.find(s=>s.box && !s.box.leaving && s.box.color===color && s.box.fill.length<s.box.cap);
  }

  function holePos(slot, index, cap){
    const cx=slot.x, cy=slot.y+8;
    if(cap<=3){
      const pts=[[-16,-6],[16,-6],[0,14]];
      return {x:cx+pts[index][0], y:cy+pts[index][1]};
    }
    const a=-Math.PI/2 + index*(Math.PI*2/cap);
    return {x:cx+Math.cos(a)*16, y:cy+Math.sin(a)*14};
  }

  function maybeDropBoards(){
    boards.forEach(b=>{
      if(b.removed) return;
      const left=screws.some(s=>s.bid===b.id && !s.removed);
      if(!left){
        b.removed=true;
        falls.push({b, t:0});
      }
    });
  }

  function advanceFullBoxes(){
    slots.forEach(s=>{
      if(s.box && s.box.fill.length>=s.box.cap && !s.box.leaving){
        if(s.box.fill.some(f=>f.incoming)) return;
        s.box.leaving=true;
        s.box.leaveT=0;
      }
    });
  }

  function tryDrainHolds(){
    const pos=holdLayout();
    for(let i=0;i<holds.length;i++){
      const h=holds[i];
      if(!h || h.incoming) continue;
      const slot=findBoxFor(h.color);
      if(!slot) continue;
      const idx=slot.box.fill.length;
      const hp=holePos(slot, idx, slot.box.cap);
      slot.box.fill.push({color:h.color, incoming:true});
      flies.push({ color:h.color, x:pos[i].x, y:pos[i].y, x0:pos[i].x, y0:pos[i].y, x1:hp.x, y1:hp.y, t:0, slot:slot, fi:idx, fromHold:true });
      holds[i]=null;
    }
    compactHolds();
  }

  function tickLeaving(dt){
    slots.forEach(s=>{
      if(s.box && s.box.leaving){
        s.box.leaveT+=(dt||0.016);
        if(s.box.leaveT>0.35){
          s.box= queue.length? queue.shift(): null;
          tryDrainHolds();
        }
      }
    });
  }

  function holdsEmpty(){ return holds.every(h=>!h); }

  function checkWin(){
    if(winPending || failPending || mode!=='play') return;
    if(screws.every(s=>s.removed) && boards.every(b=>b.removed) && flies.length===0 && holdsEmpty()){
      winPending=true;
      setTimeout(onLevelWin, 350);
    }
  }

  function saveProgress(completedIdx){
    const completed=completedIdx+1;
    if(completed>best){ best=completed; store.set('screwPuzzleBest', String(best)); }
    const nxt=Math.min(LEVELS.length, completed+1);
    store.set('screwPuzzleNext', String(nxt));
    nextLevel=nxt;
  }

  function onLevelWin(){
    saveProgress(levelIdx);
    mode='clear';
    $('playUi').classList.add('hidden');
    $('pauseMenu').classList.add('hidden');
    const lastL=levelIdx>=LEVELS.length-1;
    $('title').textContent= lastL? '全部通关':'过关！';
    $('msg').hidden=true;
    $('endStats').hidden=false;
    $('endStats').innerHTML= lastL
      ? ('恭喜清完所有关卡<br>已完成 <b>'+LEVELS.length+'</b> 关')
      : ('第 <b>'+(levelIdx+1)+'</b> 关完成<br>最高到达第 <b>'+best+'</b> 关');
    $('start').textContent= lastL? '再来一次':'下一关';
    $('overlay').classList.remove('hidden');
  }

  function onLevelFail(){
    if(failPending || mode!=='play') return;
    failPending=true;
    mode='fail';
    toast('暂存已满');
    $('playUi').classList.add('hidden');
    $('pauseMenu').classList.add('hidden');
    $('title').textContent='失败了';
    $('msg').hidden=false;
    $('msg').textContent='暂存孔位已满';
    $('endStats').hidden=true;
    $('start').textContent='重玩本关';
    $('overlay').classList.remove('hidden');
  }

    mode='home';
    $('playUi').classList.add('hidden');
    $('pauseMenu').classList.add('hidden');
    $('title').textContent='拧螺丝解谜';
    $('msg').hidden=false;
    $('msg').textContent='点螺丝拧出，放进同色盒子；清掉全部板子就过关';
    $('endStats').hidden=false;
    $('endStats').innerHTML= best? ('最高到达第 <b>'+best+'</b> 关'): '';
    if(!best) $('endStats').hidden=true;
    $('start').textContent='开始游戏';
    $('overlay').classList.remove('hidden');
    // preview first level quietly
    buildLevel(0);
    // don't consume saved next
  }

  function startPlay(idx){
    levelIdx=idx;
    buildLevel(idx);
    mode='play';
    $('overlay').classList.add('hidden');
    $('pauseMenu').classList.add('hidden');
    $('playUi').classList.remove('hidden');
    refreshHud();
  }

  function unscrew(s){
    if(s.removed || screwBlocked(s) || mode!=='play') return false;
    const slot=findBoxFor(s.color);
    if(slot){
      s.removed=true;
      const idx=slot.box.fill.length;
      const hp=holePos(slot, idx, slot.box.cap);
      slot.box.fill.push({color:s.color, incoming:true});
      flies.push({ color:s.color, x:s.x, y:s.y, x0:s.x, y0:s.y, x1:hp.x, y1:hp.y, t:0, slot:slot, fi:idx });
      maybeDropBoards();
      refreshHud();
      return true;
    }
    const hi=freeHoldIndex();
    if(hi<0){
      onLevelFail();
      return false;
    }
    s.removed=true;
    const hp=holdLayout()[hi];
    const obj={color:s.color, incoming:true};
    holds[hi]=obj;
    flies.push({ color:s.color, x:s.x, y:s.y, x0:s.x, y0:s.y, x1:hp.x, y1:hp.y, t:0, toHold:true, holdObj:obj });
    maybeDropBoards();
    refreshHud();
    return true;
  }

  function finishFly(f){
    if(f.toHold){
      if(f.holdObj && f.holdObj.incoming) f.holdObj.incoming=false;
      compactHolds();
      tryDrainHolds();
      checkWin();
      return;
    }
    if(f.slot && f.slot.box && f.slot.box.fill[f.fi]) f.slot.box.fill[f.fi].incoming=false;
    advanceFullBoxes();
    tryDrainHolds();
    checkWin();
  }

  function onCanvasTap(x,y){
    if(mode!=='play') return;
    const locked=slots.find(s=>s.locked && Math.hypot(x-s.x,y-(s.y+4))<40);
    if(locked && items.unlock>0){
      locked.locked=false;
      slotCount++;
      if(!locked.box && queue.length) locked.box=queue.shift();
      items.unlock--; toast('解锁了一个盒子'); syncItems();
      tryDrainHolds();
      return;
    }
    const TAP_R=SR+6;
    let bestS=null, bestD=1e9;
    screws.forEach(s=>{
      if(s.removed) return;
      const d=Math.hypot(x-s.x,y-s.y);
      if(d<TAP_R && d<bestD){ bestD=d; bestS=s; }
    });
    if(!bestS) return;
    if(screwBlocked(bestS) || tapOnHigherCover(x,y,bestS.z)){
      toast('被挡住了');
      return;
    }
    unscrew(bestS);
  }

  function canvasPos(e){
    const rect=cv.getBoundingClientRect();
    const src=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
    return { x:(src.clientX-rect.left)*(W/rect.width), y:(src.clientY-rect.top)*(H/rect.height) };
  }

  /* ---------- solvability ---------- */
  function snapshotSolvable(useItems, useCenter){
    const n=screws.length;
    const boardZ=boards.map(b=>b.z);
    const boardPoly=boards.map(b=>worldBoard(b));
    const glassPolys=glass.map(g=>g.poly);
    const screwData=screws.map(s=>({x:s.x,y:s.y,z:s.z,bid:s.bid,color:s.color}));
    const colors=screwData.map(s=>s.color);
    const initMask=(1<<n)-1;
    const initialQueue=[];
    slots.forEach(s=>{ if(s.box) initialQueue.push({color:s.box.color,cap:s.box.cap,fill:s.box.fill.length}); });
    queue.forEach(b=>initialQueue.push({color:b.color,cap:b.cap,fill:b.fill.length}));
    const startSlots=slotCount;
    const startItems=useItems? {add:items.add,clear:items.clear,melt:items.melt,unlock:items.unlock}:{add:0,clear:0,melt:0,unlock:0};
    const startHolds=holds.filter(h=>h).map(h=>h.color);
    const startHCap=holdCount;

    function blocked(mask, melt, sid){
      const s=screwData[sid];
      for(let bi=0;bi<boards.length;bi++){
        if(boardZ[bi]<=s.z) continue;
        let alive=false;
        for(let i=0;i<n;i++) if(screwData[i].bid===bi && (mask&(1<<i))) {alive=true;break;}
        if(!alive) continue;
        if(useCenter ? pip(s.x,s.y,boardPoly[bi]) : circleHitsPoly(s.x,s.y,BLOCK_R,boardPoly[bi])) return true;
      }
      if(!melt){
        for(const g of glassPolys) if(useCenter ? pip(s.x,s.y,g) : circleHitsPoly(s.x,s.y,GLASS_R,g)) return true;
      }
      return false;
    }

    const memo=new Map();
    let nodes=0, nodeLimit=4000000, timedOut=false;
    function packSlots(sl){
      return sl.map(b=>b? (b.color+':'+b.fill+'/'+b.cap): '.').join(',');
    }
    function packIt(it){ return it.add+','+it.clear+','+it.melt+','+it.unlock; }
    function packHolds(hs, cap){
      return cap+':'+hs.slice().sort().join(',');
    }
    function key(mask, sl, qrest, melt, it, hs, hcap){
      return mask.toString(16)+'|'+packSlots(sl)+'|'+qrest.map(b=>b.color+b.cap+b.fill).join('')+'|'+ (melt?1:0) +'|'+packIt(it)+'|'+packHolds(hs,hcap);
    }
    function cloneQ(q){ return q.map(b=>({color:b.color,cap:b.cap,fill:b.fill})); }
    function cloneSl(sl){ return sl.map(b=>b? Object.assign({},b):null); }

    function drain(sl, qr, hs){
      let changed=true;
      while(changed){
        changed=false;
        for(let i=0;i<hs.length;i++){
          const si=sl.findIndex(b=>b && b.color===hs[i] && b.fill<b.cap);
          if(si<0) continue;
          sl[si].fill++;
          hs.splice(i,1);
          i--;
          changed=true;
          if(sl[si].fill>=sl[si].cap){
            sl[si]= qr.length? qr.shift(): null;
          }
        }
      }
    }

    function rec(mask, sl, qrest, melt, it, hs, hcap){
      if(mask===0 && hs.length===0) return true;
      if(++nodes>nodeLimit){ timedOut=true; return false; }
      const k=key(mask, sl, qrest, melt, it, hs, hcap);
      if(memo.has(k)) return memo.get(k);

      const boxMoves=[], holdMoves=[];
      for(let i=0;i<n;i++){
        if(!(mask&(1<<i))) continue;
        if(blocked(mask,melt,i)) continue;
        const col=colors[i];
        const si=sl.findIndex(b=>b && b.color===col && b.fill<b.cap);
        if(si>=0) boxMoves.push([i,si]);
        else if(hs.length<hcap) holdMoves.push(i);
      }
      boxMoves.sort((a,b)=>{
        const da=sl[a[1]].fill+1>=sl[a[1]].cap?0:1;
        const db=sl[b[1]].fill+1>=sl[b[1]].cap?0:1;
        return da-db;
      });

      function go(nmask, sl2, qr2, it2, hs2, hcap2, melt2){
        drain(sl2, qr2, hs2);
        if(rec(nmask, sl2, qr2, melt2, it2, hs2, hcap2)){ memo.set(k,true); return true; }
        return false;
      }

      for(const [sid,si] of boxMoves){
        const sl2=cloneSl(sl), qr2=cloneQ(qrest), hs2=hs.slice();
        sl2[si].fill++;
        if(sl2[si].fill>=sl2[si].cap) sl2[si]= qr2.length? qr2.shift(): null;
        if(go(mask^(1<<sid), sl2, qr2, it, hs2, hcap, melt)) return true;
      }
      for(const sid of holdMoves){
        const sl2=cloneSl(sl), qr2=cloneQ(qrest), hs2=hs.slice();
        hs2.push(colors[sid]);
        if(go(mask^(1<<sid), sl2, qr2, it, hs2, hcap, melt)) return true;
      }
      if(mask===0 && hs.length>0 && it.clear>0){
        const it2=Object.assign({},it,{clear:it.clear-1});
        if(go(0, cloneSl(sl), cloneQ(qrest), it2, [], hcap, melt)) return true;
      }
      if(it.melt>0 && !melt && glassPolys.length){
        const it2=Object.assign({},it,{melt:it.melt-1});
        if(go(mask, cloneSl(sl), cloneQ(qrest), it2, hs.slice(), hcap, true)) return true;
      }
      if(it.unlock>0 && sl.length<4){
        const it2=Object.assign({},it,{unlock:it.unlock-1});
        const sl2=cloneSl(sl), qr2=cloneQ(qrest), hs2=hs.slice();
        sl2.push(qr2.length? qr2.shift(): null);
        if(go(mask, sl2, qr2, it2, hs2, hcap, melt)) return true;
      }
      if(it.add>0 && hcap<HOLD_MAX){
        const it2=Object.assign({},it,{add:it.add-1});
        if(go(mask, cloneSl(sl), cloneQ(qrest), it2, hs.slice(), hcap+1, melt)) return true;
      }
      if(it.clear>0 && hs.length>0 && mask!==0){
        const it2=Object.assign({},it,{clear:it.clear-1});
        if(go(mask, cloneSl(sl), cloneQ(qrest), it2, [], hcap, melt)) return true;
      }
      memo.set(k,false);
      return false;
    }

    const sl=[], qrest=cloneQ(initialQueue);
    for(let i=0;i<startSlots;i++) sl.push(qrest.length? qrest.shift(): null);
    const ok=rec(initMask, sl, qrest, false, startItems, startHolds.slice(), startHCap);
    return {ok, nodes, timeout:timedOut, memo:memo.size};
  }

  function validateScrews(){
    const bad=[];
    screws.forEach(s=>{
      const b=boards[s.bid];
      if(!pip(s.x,s.y, worldBoard(b))) bad.push(s.id);
    });
    return bad;
  }

  /* ---------- draw ---------- */
  function drawBg(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#f7fbff'); g.addColorStop(0.35,'#e7f5ff'); g.addColorStop(1,'#d4efff');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.35)';
    for(let i=0;i<6;i++){
      ctx.beginPath();
      ctx.ellipse(40+i*70, 200+((i*83)%200), 90, 40, 0.2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function roundedPath(poly, rad){
    const n=poly.length;
    if(n<3) return;
    const pts=[];
    for(let i=0;i<n;i++){
      const p0=poly[(i-1+n)%n], p1=poly[i], p2=poly[(i+1)%n];
      const d01=Math.hypot(p1[0]-p0[0], p1[1]-p0[1])||1e-6;
      const d12=Math.hypot(p2[0]-p1[0], p2[1]-p1[1])||1e-6;
      const r=Math.min(rad, d01*0.45, d12*0.45);
      pts.push({
        x1:p1[0]+(p0[0]-p1[0])*r/d01,
        y1:p1[1]+(p0[1]-p1[1])*r/d01,
        ax:p1[0], ay:p1[1],
        x2:p1[0]+(p2[0]-p1[0])*r/d12,
        y2:p1[1]+(p2[1]-p1[1])*r/d12
      });
    }
    ctx.beginPath();
    ctx.moveTo(pts[0].x1, pts[0].y1);
    for(let i=0;i<n;i++){
      const t=pts[i], nx=pts[(i+1)%n];
      ctx.quadraticCurveTo(t.ax, t.ay, t.x2, t.y2);
      ctx.lineTo(nx.x1, nx.y1);
    }
    ctx.closePath();
  }

  function roundPoly(poly, width, fill, stroke, rad){
    roundedPath(poly, rad==null?16:rad);
    if(fill){ ctx.fillStyle=fill; ctx.fill(); }
    if(stroke){
      ctx.lineJoin='round'; ctx.lineCap='round';
      ctx.lineWidth=width; ctx.strokeStyle=stroke; ctx.stroke();
    }
  }

  function drawBoard(b){
    if(b.removed && (!falls.some(f=>f.b===b) || (falls.find(f=>f.b===b)||{}).t>1)) return;
    const fall=falls.find(f=>f.b===b);
    ctx.save();
    if(fall){
      const t=ease(Math.min(1,fall.t));
      ctx.translate(0, t*80);
      ctx.rotate((b.id%2?1:-1)*t*0.2);
      ctx.globalAlpha=1-t;
    }
    const poly=worldBoard(b);
    const kind=b.s && b.s[0];
    const rad= (kind==='star'||kind==='plus') ? 10 : 16;
    ctx.save();
    ctx.shadowColor='rgba(40,60,80,.18)'; ctx.shadowBlur=10; ctx.shadowOffsetY=4;
    roundPoly(poly, 16, hexRgba(b.col, 0.74), null, rad);
    ctx.restore();
    roundPoly(poly, 14, null, '#fff', rad);
    screws.filter(s=>s.bid===b.id).forEach(s=>{
      ctx.beginPath(); ctx.arc(s.x,s.y, SR-1, 0, Math.PI*2);
      ctx.fillStyle='rgba(60,50,40,.18)'; ctx.fill();
    });
    ctx.restore();
  }

  function drawScrewHead(x,y,color, ang, scale, shake){
    ctx.save();
    ctx.translate(x+(shake?Math.sin(idleT*40)*3:0), y);
    ctx.rotate(ang||0); ctx.scale(scale||1, scale||1);
    ctx.beginPath(); ctx.arc(1.5,2.5,SR,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fill();
    const g=ctx.createRadialGradient(-4,-4,2,0,0,SR);
    g.addColorStop(0, SCREW_IN[color]||'#fff');
    g.addColorStop(0.35, SCREW[color]);
    g.addColorStop(1, SCREW[color]);
    ctx.beginPath(); ctx.arc(0,0,SR,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.lineWidth=3.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(7,0);
    ctx.moveTo(0,-7); ctx.lineTo(0,7); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.15)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(7,0);
    ctx.moveTo(0,-7); ctx.lineTo(0,7); ctx.stroke();
    ctx.restore();
  }

  function drawGlass(){
    if(glassMelted) return;
    glass.forEach(g=>{
      ctx.save();
      ctx.globalAlpha=0.42;
      roundPoly(g.poly, 8, 'rgba(190,230,255,0.9)', 'rgba(255,255,255,0.95)', 14);
      ctx.globalAlpha=0.22;
      ctx.strokeStyle='#fff'; ctx.lineWidth=2;
      const p=g.poly[0];
      ctx.beginPath(); ctx.moveTo(p[0]+8,p[1]+6); ctx.lineTo(p[0]+28,p[1]+18); ctx.stroke();
      ctx.restore();
    });
  }

  function drawHolds(){
    const pos=holdLayout(), n=holdCount;
    const pad=26, w=n*HOLD_GAP+pad, h=40;
    const x=W/2-w/2, y=HOLD_Y-h/2;
    ctx.save();
    ctx.shadowColor='rgba(40,70,100,.12)'; ctx.shadowBlur=8; ctx.shadowOffsetY=2;
    roundRectPath(x,y,w,h,h/2);
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fill();
    ctx.shadowColor='transparent';
    ctx.lineWidth=2; ctx.strokeStyle='rgba(186,210,228,.95)'; ctx.stroke();
    pos.forEach((p,i)=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,HOLD_R,0,Math.PI*2);
      ctx.fillStyle='rgba(70,90,110,.16)'; ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.stroke();
      const hld=holds[i];
      if(hld && !hld.incoming) drawScrewHead(p.x, p.y, hld.color, 0, 0.72, 0);
    });
    ctx.restore();
  }

  function drawBox(slot){
    const x=slot.x, y=slot.y;
    ctx.save();
    ctx.translate(x,y);
    if(slot.box && slot.box.leaving){
      ctx.translate(0, -slot.box.leaveT*60);
      ctx.globalAlpha=1-Math.min(1,slot.box.leaveT/0.35);
    }
    if(slot.locked && !slot.box){
      ctx.strokeStyle='#9ee0d8'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-14,-46); ctx.quadraticCurveTo(0,-62,14,-46); ctx.stroke();
      roundRectPath(-34,-42,68,70,14);
      ctx.fillStyle='#b6f0ea'; ctx.fill();
      ctx.lineWidth=4; ctx.strokeStyle='#7fd5cc'; ctx.stroke();
      ctx.fillStyle='#1fa89a';
      ctx.font='bold 12px system-ui,-apple-system,sans-serif';
      ctx.textAlign='center';
      ctx.fillText('解锁',0,-2);
      ctx.fillText('盒子',0,14);
      ctx.restore();
      return;
    }
    if(!slot.box){ ctx.restore(); return; }
    const col=SCREW[slot.box.color];
    ctx.strokeStyle=col; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-14,-46); ctx.quadraticCurveTo(0,-62,14,-46); ctx.stroke();
    roundRectPath(-36,-42,72,74,16);
    ctx.fillStyle=col; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.stroke();
    const cap=slot.box.cap;
    for(let i=0;i<cap;i++){
      const hp=holePos({x:0,y:8}, i, cap);
      ctx.beginPath(); ctx.arc(hp.x, hp.y-8, 9, 0, Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.22)'; ctx.fill();
      const f=slot.box.fill[i];
      if(f && !f.incoming){
        drawScrewHead(hp.x, hp.y-8, f.color, 0, 0.55, 0);
      }
    }
    ctx.restore();
  }

  function roundRectPath(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawQueueDots(){
    const n=queue.length;
    if(!n) return;
    const x0=W/2-(n-1)*8;
    ctx.save();
    for(let i=0;i<n;i++){
      ctx.beginPath(); ctx.arc(x0+i*16, 214, 3.2, 0, Math.PI*2);
      ctx.fillStyle=i===0? '#8aa0b5':'#d3deea';
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(){
    drawBg();
    slots.forEach(drawBox);
    drawHolds();
    drawQueueDots();
    const order=boards.slice().sort((a,b)=>a.z-b.z);
    order.forEach(b=>{
      drawBoard(b);
      if(b.removed && (!falls.some(f=>f.b===b) || (falls.find(f=>f.b===b)||{}).t>1)) return;
      screws.forEach(s=>{
        if(s.removed || s.bid!==b.id) return;
        drawScrewHead(s.x,s.y,s.color,0,1,s.shake);
      });
    });
    drawGlass();
    flies.forEach(f=>{
      const t=ease(Math.min(1,f.t));
      const x=lerp(f.x0,f.x1,t);
      const y=lerp(f.y0,f.y1,t) - Math.sin(t*Math.PI)*70;
      drawScrewHead(x,y,f.color, t*Math.PI*2, 1-t*0.4, 0);
    });
    sparks.forEach(p=>{
      ctx.globalAlpha=1-p.t/p.life;
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    });
  }

  function update(dt){
    idleT+=dt;
    if(toastT>0){
      toastT-=dt;
      if(toastT<=0) $('toast').classList.remove('show');
    }
    screws.forEach(s=>{ if(s.shake) s.shake=Math.max(0,s.shake-dt*2); });
    flies.forEach(f=>f.t+=dt*2.4);
    flies.filter(f=>f.t>=1).forEach(finishFly);
    flies=flies.filter(f=>f.t<1);
    falls.forEach(f=>f.t+=dt*1.6);
    falls=falls.filter(f=>f.t<1.05);
    tickLeaving(dt);
    sparks.forEach(p=>{ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; });
    sparks=sparks.filter(p=>p.t<p.life);
    if(mode==='play') checkWin();
  }

  function loop(now){
    if(!last) last=now;
    const dt=Math.min(0.05,(now-last)/1000);
    last=now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  /* ---------- events ---------- */
  function onPtr(e){
    if(e&&e.cancelable) e.preventDefault();
    if(mode!=='play') return;
    const p=canvasPos(e);
    onCanvasTap(p.x,p.y);
  }
  if(window.PointerEvent){
    cv.addEventListener('pointerdown', onPtr, {passive:false});
  } else {
    cv.addEventListener('touchstart', onPtr, {passive:false});
    cv.addEventListener('mousedown', onPtr);
  }
  document.addEventListener('contextmenu', e=>e.preventDefault());

  $('start').addEventListener('click', e=>{
    e.preventDefault(); e.stopPropagation();
    const txt=$('start').textContent;
    if(txt==='下一关') startPlay(levelIdx+1);
    else if(txt==='再来一次'){ nextLevel=1; store.set('screwPuzzleNext','1'); startPlay(0); }
    else if(txt==='重玩本关') startPlay(levelIdx);
    else startPlay(Math.max(0, Math.min(LEVELS.length-1, nextLevel-1)));
  });
  $('start').addEventListener('touchend', e=>{ e.preventDefault(); $('start').click(); }, {passive:false});

  $('pauseBtn').addEventListener('click', ()=>{
    if(mode!=='play') return;
    mode='pause';
    $('pauseMenu').classList.remove('hidden');
  });
  $('resume').addEventListener('click', ()=>{
    mode='play'; $('pauseMenu').classList.add('hidden');
  });
  $('restart').addEventListener('click', ()=>{
    $('pauseMenu').classList.add('hidden'); startPlay(levelIdx);
  });
  $('home').addEventListener('click', ()=>{
    $('pauseMenu').classList.add('hidden'); showHome();
  });

  function useAdd(){
    if(mode!=='play' || items.add<=0) return false;
    if(holdCount>=HOLD_MAX){ toast('孔位已达上限'); return false; }
    items.add--;
    holdCount++;
    holds.push(null);
    syncItems();
    toast('孔位 +1');
    return true;
  }
  function useClear(){
    if(mode!=='play' || items.clear<=0) return false;
    if(holds.every(h=>!h)){ toast('暂存是空的'); return false; }
    holds=holds.map(()=>null);
    items.clear--;
    syncItems();
    toast('已清空孔位');
    checkWin();
    return true;
  }
  function useMelt(){
    if(mode!=='play' || items.melt<=0) return false;
    if(glassMelted || !glass.length){ toast('这一关没有玻璃'); return false; }
    glassMelted=true; items.melt--; syncItems(); toast('玻璃已融化');
    return true;
  }

  $('itAdd').addEventListener('click', ()=>{ useAdd(); });
  $('itClear').addEventListener('click', ()=>{ useClear(); });
  $('itMelt').addEventListener('click', ()=>{ useMelt(); });

  showHome();
  last=performance.now();
  requestAnimationFrame(loop);

  window.__puzzle = {
    start: ()=>startPlay(0),
    startLevel: (n)=>startPlay(n),
    get state(){
      return {
        mode, level: levelIdx+1, progress: progress(),
        remaining: screws.filter(s=>!s.removed).length,
        visible: screws.filter(s=>!s.removed && !screwBlocked(s)).length,
        boxes: slots.filter(s=>s.box).map(s=>({color:s.box.color, fill:s.box.fill.length, cap:s.box.cap})),
        holds: holds.map(h=>h?h.color:null),
        holdCount,
        title: $('title').textContent, button: $('start').textContent,
        startVisible: $('start').offsetParent!==null && !$('overlay').classList.contains('hidden'),
        msg: $('msg').textContent, best,
        locked: slots.filter(s=>s.locked && !s.box).length
      };
    },
    clickLegal(){
      let s=screws.find(s=>!s.removed && !screwBlocked(s) && findBoxFor(s.color));
      if(!s) s=screws.find(s=>!s.removed && !screwBlocked(s) && freeHoldIndex()>=0);
      if(!s) return false;
      return unscrew(s);
    },
    setLocal(i,lx,ly){
      const s=screws[i], b=boards[s.bid];
      const w=xform([[lx,ly]], b.x, b.y, b.r)[0];
      s.x=w[0]; s.y=w[1];
    },
    tap(x,y){ onCanvasTap(x,y); },
    blocked(i){ return screwBlocked(screws[i]); },
    unscrewAt(i){ return unscrew(screws[i]); },
    toastMsg(){ return toastMsg; },
    useAdd, useClear, useMelt,
    holdState(){ return {count:holdCount, slots:holds.map(h=>h?{color:h.color,incoming:!!h.incoming}:null)}; },
    shapes(){ return boards.map(b=>b.s && b.s[0]); },
    boardTints(){ return boards.map(b=>b.col); },
    blockDetail(){
      return screws.map((s,i)=>{
        const byCenter=[], byCircle=[];
        boards.forEach((b,bi)=>{
          if(b.removed || b.z<=s.z) return;
          if(!screws.some(t=>t.bid===bi && !t.removed)) return;
          const poly=worldBoard(b);
          if(pip(s.x,s.y,poly)) byCenter.push('B'+bi);
          if(circleHitsPoly(s.x,s.y,BLOCK_R,poly)) byCircle.push('B'+bi);
        });
        const gC=[], gR=[];
        if(!glassMelted){
          glass.forEach((g,gi)=>{
            if(pip(s.x,s.y,g.poly)) gC.push('G'+gi);
            if(circleHitsPoly(s.x,s.y,GLASS_R,g.poly)) gR.push('G'+gi);
          });
        }
        const b=boards[s.bid];
        const dx=s.x-b.x, dy=s.y-b.y, c=Math.cos(-b.r), sn=Math.sin(-b.r);
        const lx=dx*c-dy*sn, ly=dx*sn+dy*c;
        return {i,c:s.color,bid:s.bid,z:s.z,x:+s.x.toFixed(1),y:+s.y.toFixed(1),
          lx:+lx.toFixed(1),ly:+ly.toFixed(1),
          byCenter, byCircle, gC, gR,
          marginOnly: (byCircle.length||gR.length) && !byCenter.length && !gC.length};
      });
    },
    legalCount(){
      return screws.filter(s=>!s.removed && !screwBlocked(s) && (findBoxFor(s.color) || freeHoldIndex()>=0)).length;
    },
    validate: validateScrews,
    solvable(useItems){ const r=snapshotSolvable(!!useItems); return r.ok===true; },
    solvableInfo(useItems, useCenter){ return snapshotSolvable(!!useItems, !!useCenter); },
    boardColors(){
      return boards.map((b,bi)=>{
        const cols=screws.filter(s=>s.bid===bi).map(s=>s.color);
        return {n:cols.length, colors:[...new Set(cols)], tint:b.col, shape:b.s&&b.s[0]};
      });
    },
    sampleBoard(bi, step=10){
      const b=boards[bi];
      const pts=[];
      for(let lx=-120; lx<=120; lx+=step){
        for(let ly=-120; ly<=120; ly+=step){
          const wp=(()=>{const p=xform([[lx,ly]], b.x, b.y, b.r)[0]; return {x:p[0], y:p[1]};})();
          if(!pip(wp.x,wp.y,worldBoard(b))) continue;
          const over=[];
          boards.forEach((ob,oi)=>{
            if(oi===bi) return;
            if(ob.z<=b.z) return;
            if(screws.some(s=>s.bid===oi && !s.removed) && circleHitsPoly(wp.x,wp.y,BLOCK_R,worldBoard(ob))) over.push('B'+oi);
          });
          glass.forEach((g,gi)=>{ if(circleHitsPoly(wp.x,wp.y,GLASS_R,g.poly)) over.push('G'+gi); });
          if(over.length===0) pts.push({lx,ly,x:+wp.x.toFixed(1),y:+wp.y.toFixed(1)});
        }
      }
      return pts;
    },
    dump(){
      return {
        items:{...items}, slotCount, holdCount,
        holds:holds.map(h=>h?h.color:null),
        glass:glass.map(g=>({s:g.s})),
        boxes:slots.filter(s=>s.box).map(s=>({color:s.box.color,fill:s.box.fill.length,cap:s.box.cap})),
        locked:slots.filter(s=>s.locked && !s.box).length,
        queue:queue.map(b=>b.color),
        boards:boards.map((b,bi)=>({bi, z:b.z, x:b.x, y:b.y, s:b.s, col:b.col})),
        screws:screws.map((s,i)=>{
          let why=null;
          if(s.removed) why='removed';
          else if(screwBlocked(s)){
            const over=[];
            boards.forEach((b,bi)=>{
              if(b.z>s.z && screws.some(t=>t.bid===bi && !t.removed) && circleHitsPoly(s.x,s.y,BLOCK_R,worldBoard(b))) over.push('B'+bi);
            });
            if(!glassMelted){
              glass.forEach((g,gi)=>{ if(circleHitsPoly(s.x,s.y,GLASS_R,g.poly)) over.push('G'+gi); });
            }
            why=over.join('+')||'blocked?';
          }
          return {i, c:s.color, bid:s.bid, z:s.z, x:+s.x.toFixed(1), y:+s.y.toFixed(1), why, box:!!findBoxFor(s.color)};
        })
      };
    },
    clipPlan(maxR=48, step=1.5){
      const minDist=SR*2+4;
      function localOf(s){
        const b=boards[s.bid];
        const dx=s.x-b.x, dy=s.y-b.y, c=Math.cos(-b.r), sn=Math.sin(-b.r);
        return {lx:dx*c-dy*sn, ly:dx*sn+dy*c};
      }
      function worldOf(bid,lx,ly){
        return xform([[lx,ly]], boards[bid].x, boards[bid].y, boards[bid].r)[0];
      }
      function clipsAt(s,x,y){
        const out=[];
        for(const b of boards){
          if(b.removed || b.z<=s.z) continue;
          const poly=worldBoard(b);
          if(circleHitsPoly(x,y,BLOCK_R,poly) && !pip(x,y,poly)) out.push('B'+b.id);
        }
        if(!glassMelted){
          for(let gi=0;gi<glass.length;gi++){
            const g=glass[gi];
            if(circleHitsPoly(x,y,GLASS_R,g.poly) && !pip(x,y,g.poly)) out.push('G'+gi);
          }
        }
        return out;
      }
      function ok(s,x,y){
        const own=worldBoard(boards[s.bid]);
        if(!pip(x,y,own)) return false;
        for(const t of screws){
          if(t===s || t.removed || t.bid!==s.bid) continue;
          if(Math.hypot(x-t.x,y-t.y)<minDist) return false;
        }
        return clipsAt(s,x,y).length===0;
      }
      return screws.map((s,i)=>{
        if(s.removed) return null;
        const cur=localOf(s);
        const now=clipsAt(s,s.x,s.y);
        if(!now.length) return null;
        for(let r=step;r<=maxR;r+=step){
          const n=Math.max(16, Math.round(16*r/step));
          for(let a=0;a<n;a++){
            const ang=a*Math.PI*2/n;
            const lx=cur.lx+Math.cos(ang)*r, ly=cur.ly+Math.sin(ang)*r;
            const w=worldOf(s.bid,lx,ly);
            if(ok(s,w[0],w[1])) return {i,c:s.color,bid:s.bid,from:[+cur.lx.toFixed(1),+cur.ly.toFixed(1)],to:[+lx.toFixed(1),+ly.toFixed(1)],r,clips:now};
          }
        }
        return {i,c:s.color,bid:s.bid,from:[+cur.lx.toFixed(1),+cur.ly.toFixed(1)],to:null,r:null,clips:now};
      }).filter(Boolean);
    },
    nudgePlan(maxR=36, step=2){
      const minDist=SR*2+4;
      function localOf(s){
        const b=boards[s.bid];
        const dx=s.x-b.x, dy=s.y-b.y, c=Math.cos(-b.r), sn=Math.sin(-b.r);
        return {lx:dx*c-dy*sn, ly:dx*sn+dy*c};
      }
      function worldOf(bid,lx,ly){
        return xform([[lx,ly]], boards[bid].x, boards[bid].y, boards[bid].r)[0];
      }
      function clearAt(s,x,y){
        const own=worldBoard(boards[s.bid]);
        if(!pip(x,y,own)) return false;
        for(const t of screws){
          if(t===s || t.removed || t.bid!==s.bid) continue;
          if(Math.hypot(x-t.x,y-t.y)<minDist) return false;
        }
        for(const b of boards){
          if(b.removed || b.z<=s.z) continue;
          if(!screws.some(t=>t.bid===b.id && !t.removed)) continue;
          if(circleHitsPoly(x,y,BLOCK_R,worldBoard(b))) return false;
        }
        if(!glassMelted){
          for(const g of glass){
            if(circleHitsPoly(x,y,GLASS_R,g.poly)) return false;
          }
        }
        return true;
      }
      return screws.map((s,i)=>{
        if(s.removed) return null;
        if(clearAt(s,s.x,s.y)) return null;
        const cur=localOf(s);
        for(let r=step;r<=maxR;r+=step){
          const n=Math.max(16, Math.round(16*r/step));
          for(let a=0;a<n;a++){
            const ang=a*Math.PI*2/n;
            const lx=cur.lx+Math.cos(ang)*r, ly=cur.ly+Math.sin(ang)*r;
            const w=worldOf(s.bid,lx,ly);
            if(clearAt(s,w[0],w[1])) return {i,c:s.color,bid:s.bid,from:[+cur.lx.toFixed(1),+cur.ly.toFixed(1)],to:[+lx.toFixed(1),+ly.toFixed(1)],r};
          }
        }
        return {i,c:s.color,bid:s.bid,from:[+cur.lx.toFixed(1),+cur.ly.toFixed(1)],to:null,r:null};
      }).filter(Boolean);
    },
    levels: LEVELS.length
  };
})();
</script>
