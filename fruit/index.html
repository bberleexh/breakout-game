<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>切水果</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;overflow:hidden;background:#1a120c;color:#3a2a0a;
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(12,8,4,.62);border-radius:16px;gap:14px;text-align:center;padding:20px 16px;
}
#overlay.hidden{display:none}
#overlay h1{font-size:36px;letter-spacing:4px;font-weight:800;color:#fff8e7;text-shadow:0 3px 0 #8a1f12,0 6px 12px rgba(0,0,0,.4)}
#overlay p{font-size:15px;color:#fff8e7;line-height:1.75;max-width:250px;text-shadow:0 1px 4px rgba(0,0,0,.55)}
#overlay .stats{font-size:18px;color:#fff8e7;font-weight:700;line-height:1.85;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#overlay .stats b{color:#ffd54a}
button{
  background:#ffd54a;color:#3a2a0a;border:3px solid #b06a12;padding:12px 36px;border-radius:999px;
  font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #b06a12;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #b06a12}
#hud{
  position:absolute;top:10px;left:0;right:0;display:none;justify-content:space-between;gap:8px;
  padding:0 14px;font-size:15px;font-weight:800;color:#fff8e7;
  text-shadow:0 2px 0 rgba(0,0,0,.45);pointer-events:none;
}
#hud.show{display:flex}
#hud b{color:#ffd54a}
#lives b{color:#ff6b57}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最佳 <b id="best">0</b></span>
    <span id="lives">生命 <b id="life">3</b></span>
  </div>
  <div id="overlay">
    <h1 id="title">切水果</h1>
    <p id="msg">手指滑动切断水果，不要切到炸弹，漏掉三个就失败</p>
    <div id="endStats" class="stats" hidden></div>
    <button id="start" type="button">开始游戏</button>
  </div>
</div>
<script>
(function(){
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch (e) {} }
  };

  const W = 390, H = 700;
  const GRAVITY = 420;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  const $ = (id) => document.getElementById(id);
  const overlay = $('overlay'), startBtn = $('start');
  const titleEl = $('title'), msgEl = $('msg'), endStats = $('endStats'), hud = $('hud');

  function fit(){
    const sc = Math.min((innerWidth - 16) / W, (innerHeight - 16) / H);
    cv.style.width = (W * sc) + 'px';
    cv.style.height = (H * sc) + 'px';
  }
  addEventListener('resize', fit);
  addEventListener('orientationchange', fit);
  fit();

  let best = +(store.get('fruitBest') || 0);
  $('best').textContent = best;

  const KINDS = [
    { name:'苹果', r:32, fill:'#e23d2d', leaf:'#2f9e3a', stem:'#6b3c16', juice:'#ff6a55' },
    { name:'橙子', r:30, fill:'#f08a14', leaf:'#3cb64a', stem:'#6b3c16', juice:'#ffb347' },
    { name:'西瓜', r:38, fill:'#2f9e4a', stripe:'#1d6e32', belly:'#f34a5a', juice:'#ff5a6a' },
    { name:'柠檬', r:26, fill:'#f5d031', leaf:'#3cb64a', stem:'#6b3c16', juice:'#ffe56a' },
    { name:'葡萄', r:24, fill:'#7b3aa8', leaf:'#3cb64a', stem:'#4a2a16', juice:'#c46adf' },
    { name:'桃子', r:30, fill:'#ff8aa0', blush:'#ff5a78', leaf:'#3cb64a', stem:'#6b3c16', juice:'#ff9ab0' }
  ];

  let playing = false;
  let over = false;
  let score = 0;
  let lives = 3;
  let items = [];
  let halves = [];
  let particles = [];
  let trail = [];
  let slicing = false;
  let spawnT = 0;
  let runT = 0;
  let combo = 0;
  let comboT = 0;
  let comboPop = null;
  let last = 0;
  let lastDt = 1/60;
  let shake = 0;
  let flash = 0;
  let missPops = [];

  function hudSync(){
    $('score').textContent = String(score);
    $('best').textContent = String(best);
    $('life').textContent = String(lives);
  }

  function decorateStart(){
    items = []; halves = []; particles = []; trail = [];
    const places = [[78,560],[195,590],[312,555],[70,165],[320,170]];
    places.forEach((pt,i) => {
      const kind = KINDS[i % KINDS.length];
      items.push({ type:'fruit', kind:kind, x:pt[0], y:pt[1], vx:0, vy:0, r:kind.r, rot:i*0.7, spin:0.35, sliced:false, decor:true });
    });
    items.push({ type:'bomb', x:320, y:250, vx:0, vy:0, r:26, rot:0.2, spin:0.25, sliced:false, decor:true });
  }

  function showStart(){
    playing = false; over = false;
    decorateStart();
    titleEl.textContent = '切水果';
    msgEl.hidden = false;
    msgEl.textContent = '手指滑动切断水果，不要切到炸弹，漏掉三个就失败';
    endStats.hidden = !best;
    endStats.innerHTML = best ? ('最佳 <b>' + best + '</b>') : '';
    startBtn.textContent = '开始游戏';
    overlay.classList.remove('hidden');
    hud.classList.remove('show');
  }

  function showEnd(reason){
    playing = false;
    over = true;
    slicing = false;
    trail = [];
    if (score > best){
      best = score;
      store.set('fruitBest', String(best));
    }
    titleEl.textContent = '游戏结束';
    msgEl.hidden = false;
    msgEl.textContent = reason || '再试一次吧';
    endStats.hidden = false;
    endStats.innerHTML = '得分 <b>' + score + '</b><br>最佳 <b>' + best + '</b>';
    startBtn.textContent = '再来一次';
    overlay.classList.remove('hidden');
    hud.classList.remove('show');
    hudSync();
  }

  function startGame(){
    playing = true; over = false;
    score = 0; lives = 3;
    items = []; halves = []; particles = []; trail = [];
    missPops = []; combo = 0; comboT = 0; comboPop = null;
    spawnT = 0.7; runT = 0; shake = 0; flash = 0;
    slicing = false;
    overlay.classList.add('hidden');
    hud.classList.add('show');
    hudSync();
    last = performance.now();
  }

  function rand(a,b){ return a + Math.random() * (b - a); }

  function throwItem(isBomb){
    const x = rand(60, W - 60);
    const goingRight = x < W / 2;
    const vx = (goingRight ? 1 : -1) * rand(30, 90);
    const vy = -rand(540, 680);
    if (isBomb){
      items.push({
        type:'bomb', x:x, y:H + 30, vx:vx, vy:vy, r:28,
        rot:rand(0, Math.PI*2), spin:rand(-5,5), sliced:false
      });
    } else {
      const kind = KINDS[Math.floor(Math.random() * KINDS.length)];
      items.push({
        type:'fruit', kind:kind, x:x, y:H + 30, vx:vx, vy:vy, r:kind.r,
        rot:rand(0, Math.PI*2), spin:rand(-3.5, 3.5), sliced:false
      });
    }
  }

  function maybeSpawn(){
    const wave = Math.min(1, runT / 45);
    const interval = 1.15 - wave * 0.5;
    spawnT -= lastDt;
    if (spawnT > 0) return;
    spawnT = interval * rand(0.75, 1.15);
    const cluster = Math.random() < 0.18 + wave * 0.2 ? (Math.random() < 0.45 ? 3 : 2) : 1;
    for (let i = 0; i < cluster; i++){
      const bombChance = runT < 6 ? 0 : (0.08 + wave * 0.1);
      setTimeout(() => {
        if (playing) throwItem(Math.random() < bombChance);
      }, i * 140);
    }
  }

  function segHits(x1,y1,x2,y2,cx,cy,r){
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    if (len2 < 1) return Math.hypot(cx-x1, cy-y1) <= r;
    let t = ((cx-x1)*dx + (cy-y1)*dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = x1 + t*dx, py = y1 + t*dy;
    return Math.hypot(cx-px, cy-py) <= r;
  }

  function burst(x, y, color, n){
    for (let i = 0; i < n; i++){
      const a = rand(0, Math.PI*2), sp = rand(80, 320);
      particles.push({
        x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 40,
        life:rand(0.3, 0.65), t:0, r:rand(2, 5), col:color
      });
    }
  }

  function splitFruit(it, nx, ny){
    const k = it.kind;
    for (let side of [-1, 1]){
      halves.push({
        kind:k, x:it.x, y:it.y,
        vx: it.vx + nx * side * 180 + rand(-40,40),
        vy: it.vy + ny * side * 80 - 80,
        rot: it.rot, spin: side * rand(4, 9),
        side: side, r: it.r, t:0
      });
    }
    burst(it.x, it.y, k.juice, 18);
  }

  function sliceItem(it, x1,y1,x2,y2){
    if (it.sliced) return;
    it.sliced = true;
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy) || 1;
    const nx = -dy/len, ny = dx/len;
    if (it.type === 'bomb'){
      burst(it.x, it.y, '#ff9a2a', 28);
      burst(it.x, it.y, '#333', 16);
      shake = 12; flash = 1;
      showEnd('切到炸弹了！');
      return;
    }
    splitFruit(it, nx, ny);
    comboT = 0.55;
    combo += 1;
    const add = 10 * combo;
    score += add;
    comboPop = { x: it.x, y: it.y - it.r - 8, t:0, text: combo > 1 ? ('连切 ×' + combo + '  +' + add) : ('+' + add) };
    hudSync();
  }

  function missFruit(it){
    it.sliced = true;
    lives -= 1;
    missPops.push({ x: Math.max(40, Math.min(W-40, it.x)), y: H - 70, t:0 });
    hudSync();
    shake = 6;
    if (lives <= 0) showEnd('漏掉三个水果了');
  }

  function canvasPos(e){
    const rect = cv.getBoundingClientRect();
    const src = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
    return {
      x: (src.clientX - rect.left) * (W / rect.width),
      y: (src.clientY - rect.top) * (H / rect.height)
    };
  }

  function addTrail(x,y){
    trail.push({ x:x, y:y, t:0.18 });
    if (trail.length > 14) trail.shift();
  }

  function slashFromTo(x1,y1,x2,y2){
    const dist = Math.hypot(x2-x1, y2-y1);
    if (dist < 8) return;
    for (let i = 0; i < items.length; i++){
      const it = items[i];
      if (it.sliced) continue;
      if (segHits(x1,y1,x2,y2, it.x, it.y, it.r + 6)){
        sliceItem(it, x1,y1,x2,y2);
        if (!playing) return;
      }
    }
  }

  function onDown(e){
    if (e && e.cancelable) e.preventDefault();
    if (!playing) return;
    const p = canvasPos(e);
    slicing = true;
    trail = [{ x:p.x, y:p.y, t:0.18 }];
    try { if (e.pointerId != null) cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e){
    if (!playing || !slicing) return;
    if (e && e.cancelable) e.preventDefault();
    const p = canvasPos(e);
    const lastP = trail[trail.length - 1];
    addTrail(p.x, p.y);
    if (lastP) slashFromTo(lastP.x, lastP.y, p.x, p.y);
  }
  function onUp(e){
    if (e && e.cancelable) e.preventDefault();
    slicing = false;
  }

  function drawBg(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#3a2416');
    g.addColorStop(0.55, '#2a1a10');
    g.addColorStop(1, '#1a100a');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(0,0,0,.22)';
    ctx.lineWidth = 16;
    for (let y = 0; y < H; y += 36){
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(130, y+8, 250, y-8, W, y+4);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(80,40,16,.55)';
    ctx.lineWidth = 10;
    ctx.strokeRect(8,8,W-16,H-16);
  }

  function drawFruitBody(k, r){
    if (k.name === '西瓜'){
      const grd = ctx.createRadialGradient(-r*0.3,-r*0.3,4,0,0,r);
      grd.addColorStop(0, '#5bc96a'); grd.addColorStop(1, k.fill);
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = grd; ctx.fill();
      ctx.strokeStyle = k.stripe; ctx.lineWidth = r*0.18; ctx.lineCap = 'butt';
      for (let i=-2;i<=2;i++){
        ctx.beginPath();
        ctx.ellipse(0,0,r*0.92, r*0.22, i*0.4, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
      ctx.strokeStyle = '#1a4e24'; ctx.lineWidth = 2; ctx.stroke();
      return;
    }
    if (k.name === '葡萄'){
      const spots = [[-8,-6], [8,-6], [0,4], [-10,6], [10,6], [0,-12]];
      spots.forEach(([sx,sy], i) => {
        ctx.beginPath();
        ctx.arc(sx*r/24, sy*r/24, r*0.42, 0, Math.PI*2);
        ctx.fillStyle = i%2 ? '#8d4bb8' : k.fill;
        ctx.fill();
      });
      return;
    }
    const grd = ctx.createRadialGradient(-r*0.35,-r*0.35,3,0,0,r);
    grd.addColorStop(0, 'rgba(255,255,255,0.4)'); grd.addColorStop(0.25, k.fill); grd.addColorStop(1, k.fill);
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle = grd; ctx.fill();
    if (k.blush){
      ctx.beginPath(); ctx.ellipse(r*0.25, r*0.15, r*0.4, r*0.3, 0.3, 0, Math.PI*2);
      ctx.fillStyle = k.blush + '99'; ctx.fill();
    }
    if (k.name === '橙子'){
      ctx.strokeStyle = 'rgba(180,80,0,.25)'; ctx.lineWidth = 1;
      for (let i=0;i<6;i++){
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(i*Math.PI/3)*r*0.9, Math.sin(i*Math.PI/3)*r*0.9); ctx.stroke();
      }
    }
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2; ctx.stroke();
    if (k.stem){
      ctx.strokeStyle = k.stem; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, -r+2); ctx.quadraticCurveTo(4, -r-8, 2, -r-12); ctx.stroke();
    }
    if (k.leaf){
      ctx.fillStyle = k.leaf;
      ctx.beginPath();
      ctx.ellipse(8, -r-6, 8, 4, 0.6, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawFruit(it){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    drawFruitBody(it.kind, it.r);
    ctx.restore();
  }

  function drawHalf(h){
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.beginPath();
    ctx.rect(-h.r-2, h.side > 0 ? 0 : -h.r-2, h.r*2+4, h.r+2);
    ctx.clip();
    drawFruitBody(h.kind, h.r);
    if (h.kind.belly || h.kind.juice){
      ctx.beginPath();
      ctx.moveTo(-h.r, 0); ctx.lineTo(h.r, 0);
      ctx.strokeStyle = h.kind.belly || h.kind.juice;
      ctx.lineWidth = 5; ctx.stroke();
    }
    ctx.restore();
  }

  function drawBomb(it){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);
    ctx.beginPath(); ctx.arc(3, 5, it.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
    const g = ctx.createRadialGradient(-8,-8,4,0,0,it.r);
    g.addColorStop(0, '#555'); g.addColorStop(1, '#1a1a1a');
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0,0,it.r*0.55,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-7,-4,3.2,0,Math.PI*2); ctx.arc(7,-4,3.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c33';
    ctx.beginPath(); ctx.ellipse(0,8,7,4,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -it.r+2); ctx.quadraticCurveTo(10, -it.r-10, 8, -it.r-16); ctx.stroke();
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(8, -it.r-16, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawTrail(){
    if (trail.length < 2) return;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < trail.length; i++){
      const p = trail[i], q = trail[i-1];
      const w = 2 + (i / trail.length) * 10;
      ctx.strokeStyle = 'rgba(255,248,230,' + (0.25 + i/trail.length*0.7) + ')';
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(q.x,q.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    }
  }

  function drawPops(){
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px system-ui,-apple-system,sans-serif';
    if (comboPop){
      const k = 1 - comboPop.t / 0.7;
      if (k > 0){
        ctx.globalAlpha = k;
        ctx.fillStyle = '#ffd54a';
        ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 4;
        ctx.strokeText(comboPop.text, comboPop.x, comboPop.y - comboPop.t * 30);
        ctx.fillText(comboPop.text, comboPop.x, comboPop.y - comboPop.t * 30);
        ctx.globalAlpha = 1;
      }
    }
    ctx.font = 'bold 16px system-ui,-apple-system,sans-serif';
    missPops.forEach(p => {
      const k = 1 - p.t / 0.7;
      if (k <= 0) return;
      ctx.globalAlpha = k;
      ctx.fillStyle = '#ff6b57';
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 4;
      ctx.strokeText('漏掉了', p.x, p.y - p.t * 24);
      ctx.fillText('漏掉了', p.x, p.y - p.t * 24);
      ctx.globalAlpha = 1;
    });
  }

  function update(dt){
    if (playing){
      runT += dt;
      maybeSpawn();
      comboT -= dt;
      if (comboT <= 0) combo = 0;
    }
    if (comboPop){ comboPop.t += dt; if (comboPop.t > 0.7) comboPop = null; }
    missPops.forEach(p => p.t += dt);
    missPops = missPops.filter(p => p.t < 0.7);
    shake = Math.max(0, shake - dt * 24);
    flash = Math.max(0, flash - dt * 2.2);

    trail.forEach(p => p.t -= dt);
    trail = trail.filter(p => p.t > 0);

    items.forEach(it => {
      if (it.decor){ it.rot += it.spin * dt; return; }
      it.vy += GRAVITY * dt;
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      it.rot += it.spin * dt;
      if (it.x < it.r){ it.x = it.r; it.vx *= -0.6; }
      if (it.x > W - it.r){ it.x = W - it.r; it.vx *= -0.6; }
    });
    if (playing){
      items.forEach(it => {
        if (!it.sliced && it.y - it.r > H + 8){
          if (it.type === 'fruit') missFruit(it);
          else it.sliced = true;
        }
      });
    }
    items = items.filter(it => it.y < H + 80 && !it.sliced);

    halves.forEach(h => {
      h.vy += GRAVITY * dt; h.x += h.vx * dt; h.y += h.vy * dt;
      h.rot += h.spin * dt; h.t += dt;
    });
    halves = halves.filter(h => h.y < H + 80 && h.t < 2);

    particles.forEach(p => {
      p.t += dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    });
    particles = particles.filter(p => p.t < p.life);
  }

  function draw(){
    ctx.save();
    if (shake > 0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    drawBg();
    halves.forEach(drawHalf);
    items.forEach(it => it.type === 'bomb' ? drawBomb(it) : drawFruit(it));
    particles.forEach(p => {
      const k = 1 - p.t/p.life;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*k,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    });
    drawTrail();
    drawPops();
    if (flash > 0){
      ctx.fillStyle = 'rgba(255,80,30,' + (flash*0.45) + ')';
      ctx.fillRect(0,0,W,H);
    }
    ctx.restore();
  }

  function loop(now){
    if (!last) last = now;
    lastDt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(lastDt);
    draw();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation(); startGame();
  });
  startBtn.addEventListener('touchend', function(e){
    e.preventDefault(); e.stopPropagation(); startGame();
  }, {passive:false});

  if (window.PointerEvent){
    cv.addEventListener('pointerdown', onDown, {passive:false});
    cv.addEventListener('pointermove', onMove, {passive:false});
    cv.addEventListener('pointerup', onUp, {passive:false});
    cv.addEventListener('pointercancel', onUp, {passive:false});
  } else {
    cv.addEventListener('touchstart', onDown, {passive:false});
    cv.addEventListener('touchmove', onMove, {passive:false});
    cv.addEventListener('touchend', onUp, {passive:false});
    cv.addEventListener('mousedown', onDown, {passive:false});
    addEventListener('mousemove', onMove, {passive:false});
    addEventListener('mouseup', onUp, {passive:false});
  }
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  showStart();
  last = performance.now();
  requestAnimationFrame(loop);

  window.__fruit = {
    start: startGame,
    get state(){
      return {
        playing: playing, over: over, score: score, lives: lives, best: best,
        fruits: items.filter(i => i.type==='fruit' && !i.sliced).length,
        bombs: items.filter(i => i.type==='bomb' && !i.sliced).length,
        title: titleEl.textContent, button: startBtn.textContent,
        msg: msgEl.textContent
      };
    },
    spawnFruitAt(x,y){
      const kind = KINDS[0];
      items.push({ type:'fruit', kind:kind, x:x, y:y, vx:0, vy:0, r:kind.r, rot:0, spin:0, sliced:false });
    },
    spawnBombAt(x,y){
      items.push({ type:'bomb', x:x, y:y, vx:0, vy:0, r:28, rot:0, spin:0, sliced:false });
    },
    forceMiss(){
      const kind = KINDS[0];
      const it = { type:'fruit', kind:kind, x:200, y:H+40, vx:0, vy:0, r:kind.r, rot:0, spin:0, sliced:false };
      missFruit(it);
    }
  };
})();
</script>
</body>
</html>
