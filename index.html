<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打砖块</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;touch-action:none;user-select:none}
h1{font-size:28px;margin-bottom:8px;letter-spacing:4px}
.bar{display:flex;gap:20px;margin-bottom:10px;font-size:16px}
.bar b{color:#facc15}
#wrap{position:relative}
canvas{background:#1e293b;border-radius:12px;box-shadow:0 0 30px rgba(250,204,21,.15);display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,23,42,.82);border-radius:12px;gap:14px;text-align:center;padding:10px}
#overlay h2{font-size:26px}
#overlay p{font-size:14px;color:#94a3b8;line-height:1.7}
button{background:#facc15;color:#0f172a;border:0;padding:10px 28px;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer}
label{font-size:14px;color:#cbd5e1}
</style>
</head>
<body>
<h1>🧱 打砖块</h1>
<div class="bar"><span>得分 <b id="score">0</b></span><span>生命 <b id="lives">3</b></span><span>关卡 <b id="level">1</b></span></div>
<div id="wrap">
<canvas id="c"></canvas>
<div id="overlay">
<h2 id="title">打砖块</h2>
<p id="msg">手指左右滑动挡板，点屏幕发球<br>电脑上可用鼠标或 ← → 键</p>
<label id="spdbox">速度 <input id="spd" type="range" min="1" max="10" value="2" style="vertical-align:middle;width:140px"> <b id="spdv">2</b></label>
<button id="start">开始游戏</button>
</div>
</div>
<script>
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const W=480,H=600;const cv=document.getElementById('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
function fit(){const sc=Math.min((innerWidth-24)/W,(innerHeight-130)/H,1);cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';}
addEventListener('resize',fit);fit();
const COLS=8,ROWS=5,BW=52,BH=20,GAP=6,TOP=70,LEFT=(W-(COLS*BW+(COLS-1)*GAP))/2;
const colors=['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa','#f472b6'];
let paddle,ball,bricks,score,lives,level,running=false,paused=false,stuck=true,keys={},baseSpeed,raf,last;
function makeBricks(){bricks=[];const rows=Math.min(ROWS+level-1,8);for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){const hp=(level>1&&r<level-1)?2:1;bricks.push({x:LEFT+c*(BW+GAP),y:TOP+r*(BH+GAP),hp,color:colors[r%colors.length]});}}
function resetBall(){stuck=true;ball={x:paddle.x+paddle.w/2,y:paddle.y-9,r:8,vx:0,vy:0};}
function launch(){if(!stuck)return;stuck=false;const sp=baseSpeed*(1+(level-1)*0.08);const a=-Math.PI/2+(Math.random()-.5)*0.8;ball.vx=Math.cos(a)*sp;ball.vy=Math.sin(a)*sp;}
function start(){baseSpeed=1.2+(+$('spd').value)*0.6;score=0;lives=3;level=1;paddle={w:90,h:12,x:W/2-45,y:H-40};makeBricks();resetBall();upd();running=true;paused=false;$('overlay').style.display='none';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function upd(){$('score').textContent=score;$('lives').textContent=lives;$('level').textContent=level;}
function loop(t){const dt=Math.min((t-last)/16.67,3);last=t;if(running&&!paused)update(dt);draw();raf=requestAnimationFrame(loop);}
function update(dt){
 const pv=7*dt;if(keys.left)paddle.x-=pv;if(keys.right)paddle.x+=pv;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
 if(stuck){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r-1;return;}
 const steps=4;for(let i=0;i<steps;i++){ball.x+=ball.vx*dt/steps;ball.y+=ball.vy*dt/steps;collide();if(!running||stuck)return;}
}
function collide(){
 const b=ball;
 if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx);} if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx);} if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy);}
 if(b.y>H+b.r){lives--;upd();if(lives<=0)return end(false);resetBall();return;}
 const p=paddle;if(b.vy>0&&b.y+b.r>=p.y&&b.y+b.r<=p.y+p.h+8&&b.x>=p.x-b.r&&b.x<=p.x+p.w+b.r){
  const hit=(b.x-(p.x+p.w/2))/(p.w/2);const sp=Math.hypot(b.vx,b.vy);const a=hit*Math.PI/3;b.vx=sp*Math.sin(a);b.vy=-sp*Math.cos(a);b.y=p.y-b.r;}
 for(const k of bricks){if(k.hp<=0)continue;
  const cx=Math.max(k.x,Math.min(b.x,k.x+BW)),cy=Math.max(k.y,Math.min(b.y,k.y+BH));const dx=b.x-cx,dy=b.y-cy;
  if(dx*dx+dy*dy<=b.r*b.r){k.hp--;score+=k.hp>0?5:10;upd();
   if(Math.abs(dx)>Math.abs(dy))b.vx=dx>0?Math.abs(b.vx):-Math.abs(b.vx);else b.vy=dy>0?Math.abs(b.vy):-Math.abs(b.vy);
   if(bricks.every(q=>q.hp<=0)){level++;upd();if(level>5)return end(true);makeBricks();resetBall();}
   break;}}
}
function end(win){running=false;const best=+store.get('breakoutBest')||0;let rec='';if(score>best){store.set('breakoutBest',score);rec='<br>🎉 新纪录！';}
 $('title').textContent=win?'全部通关！':'游戏结束';$('msg').innerHTML=`本局得分 ${score}${rec}<br>最高分 ${Math.max(best,score)}`;$('start').textContent='再来一局';$('start').style.display='';$('spdbox').style.display='';$('overlay').style.display='flex';}
function pause(){if(!running)return;paused=!paused;if(paused){$('title').textContent='已暂停';$('msg').textContent='按空格继续，或点下方按钮';$('start').style.display='none';$('spdbox').style.display='none';$('overlay').style.display='flex';$('overlay').onclick=()=>{if(paused)pause();};}else{$('overlay').style.display='none';$('overlay').onclick=null;$('start').style.display='';$('spdbox').style.display='';last=performance.now();}}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
function draw(){ctx.clearRect(0,0,W,H);if(!paddle)return;
 for(const k of bricks){if(k.hp<=0)continue;ctx.fillStyle=k.color;ctx.globalAlpha=k.hp>1?1:.85;rr(k.x,k.y,BW,BH,5);if(k.hp>1){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}}
 ctx.globalAlpha=1;ctx.fillStyle='#e2e8f0';rr(paddle.x,paddle.y,paddle.w,paddle.h,6);
 ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
 if(stuck&&running&&!paused){ctx.fillStyle='#94a3b8';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('点击屏幕或按 ↑ / 空格 发球',W/2,H/2+60);}
}
$('start').onclick=e=>{e.stopPropagation();start();};$('spd').oninput=()=>{$('spdv').textContent=$('spd').value};
addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
 if(e.key==' '||e.key=='ArrowUp'){e.preventDefault();if(!running)return start();if(stuck&&!paused&&e.key=='ArrowUp')return launch();if(stuck&&!paused)return launch();pause();}});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;});
function moveTo(clientX){const r=cv.getBoundingClientRect();if(!paddle)return;paddle.x=Math.max(0,Math.min(W-paddle.w,(clientX-r.left)/r.width*W-paddle.w/2));}
cv.addEventListener('mousemove',e=>moveTo(e.clientX));
cv.addEventListener('touchmove',e=>{e.preventDefault();moveTo(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchstart',e=>{moveTo(e.touches[0].clientX);if(running&&!paused)launch();},{passive:true});
cv.addEventListener('mousedown',()=>{if(running&&!paused)launch();});
paddle={w:90,h:12,x:W/2-45,y:H-40};level=1;makeBricks();resetBall();last=performance.now();raf=requestAnimationFrame(loop);
</script>
</body>
</html>
